<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Kano Wand MakeCode Canvas</title>
  <!-- Load Google Blockly via CDN -->
  <script src="https://unpkg.com"></script>
  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: #1e1e2f;
      color: #fff;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    header {
      background-color: #2d2d44;
      padding: 10px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid #3d3d5c;
    }
    h1 { margin: 0; font-size: 1.5rem; color: #a29bfe; }
    #main-container { display: flex; flex: 1; }
    #blocklyDiv { flex: 1; height: 100%; }
    #preview-panel {
      width: 320px;
      background-color: #1a1a26;
      border-left: 2px solid #3d3d5c;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }
    button {
      background-color: #6c5ce7;
      color: white;
      border: none;
      padding: 12px;
      border-radius: 6px;
      font-size: 1rem;
      cursor: pointer;
      font-weight: bold;
    }
    button:hover { background-color: #5b4bc4; }
  </style>
</head>
<body>

  <header>
    <h1>🪄 Kano Wand MakeCode Studio</h1>
    <button id="runBtn">▶ Run Code</button>
  </header>

  <div id="main-container">
    <div id="blocklyDiv"></div>
    <div id="preview-panel">
      <h3>Live Python Output</h3>
      <textarea id="outputCode" style="width:100%; height:85%; background:#0f0f1a; color:#00ffcc; border:1px solid #3d3d5c; font-family:monospace; padding:10px; box-sizing:border-box; resize:none;" readonly placeholder="Generated Python code will appear here..."></textarea>
    </div>
  </div>

  <!-- Define the blocks available in the sidebar toolbox -->
  <xml id="toolbox" style="display: none">
    <category name="Events" colour="#5b67a5">
      <block type="wand_on_button"></block>
    </category>
    <category name="Actions" colour="#5ba55b">
      <block type="wand_set_led"></block>
    </category>
  </xml>

  <script src="app.js"></script>
</body>
</html>
