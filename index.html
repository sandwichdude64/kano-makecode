<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Kano Wand MakeCode Canvas</title>
  
  <!-- 1. Load Google Blockly Core Library -->
  <script src="https://cloudflare.com"></script>
</head>
<body>
  <style>
    body {
      margin: 0; font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: #1e1e2f; color: #fff; display: flex; flex-direction: column; height: 100vh;
    }
    header {
      background-color: #2d2d44; padding: 10px 20px; display: flex;
      justify-content: space-between; align-items: center; border-bottom: 2px solid #3d3d5c;
    }
    h1 { margin: 0; font-size: 1.5rem; color: #a29bfe; }
    #main-container { display: flex; flex: 1; height: calc(100vh - 60px); }
    #blocklyDiv { flex: 1; height: 100%; width: 100%; }
    #preview-panel {
      width: 320px; background-color: #1a1a26; border-left: 2px solid #3d3d5c;
      padding: 20px; display: flex; flex-direction: column; gap: 15px;
    }
    button {
      background-color: #6c5ce7; color: white; border: none; padding: 12px;
      border-radius: 6px; font-size: 1rem; cursor: pointer; font-weight: bold;
    }
    button:hover { background-color: #5b4bc4; }
  </style>

  <header>
    <h1>🪄 Kano Wand MakeCode Studio</h1>
    <button id="runBtn">▶ Run Code</button>
  </header>

  <div id="main-container">
    <div id="blocklyDiv"></div>
    <div id="preview-panel">
      <h3>Live Python Output</h3>
      <textarea id="outputCode" style="width:100%; height:85%; background:#0f0f1a; color:#00ffcc; border:1px solid #3d3d5c; font-family:monospace; padding:10px; box-sizing:border-box; resize:none;" readonly placeholder="Generated Python code will appear here..."></textarea>
    </div>
  </div>

  <!-- Toolbox Setup -->
  <xml id="toolbox" style="display: none">
    <category name="Events" colour="#5b67a5">
      <block type="wand_on_button"></block>
    </category>
    <category name="Actions" colour="#5ba55b">
      <block type="wand_set_led"></block>
    </category>
  </xml>

  <!-- All JavaScript is placed right here at the bottom of the body -->
  <script>
    // Force a 500ms delay to make sure the cdnjs script is fully registered in memory
    window.addEventListener('load', () => {
      setTimeout(() => {
        if (typeof Blockly === 'undefined') {
          alert("Blockly framework failed to load from CDN. Check your internet connection!");
          return;
        }

        // 1. Define Visual Custom Block Shapes
        Blockly.Blocks['wand_on_button'] = {
          init: function() {
            this.appendDummyInput().appendField("When wand button is pressed");
            this.appendStatementInput("DO").setCheck(null).appendField("do");
            this.setColour(230);
          }
        };

        Blockly.Blocks['wand_set_led'] = {
          init: function() {
            this.appendDummyInput()
                .appendField("Set wand light to")
                .appendField(new Blockly.FieldDropdown([["Red","RED"], ["Blue","BLUE"], ["Green","GREEN"], ["Gold","GOLD"]]), "COLOR");
            this.setPreviousStatement(true, null);
            this.setNextStatement(true, null);
            this.setColour(120);
          }
        };

        // 2. Initialize the Python Generator engine manually
        const PythonGenerator = new Blockly.Generator('Python');
        PythonGenerator.scrub_ = function(block, code, thisOnly) {
          const nextBlock = block.getNextBlock();
          const nextCode = nextBlock && !thisOnly ? PythonGenerator.blockToCode(nextBlock) : '';
          return code + nextCode;
        };

        // 3. Map Block Rules straight to Python strings
        PythonGenerator['wand_on_button'] = function(block) {
          const statements_do = PythonGenerator.statementToCode(block, 'DO');
          return `def on_button(self, pressed):\n  if pressed:\n${statements_do || '    pass\n'}`;
        };

        PythonGenerator['wand_set_led'] = function(block) {
          const dropdown_color = block.getFieldValue('COLOR');
          const colorMap = { 'RED': '#FF0000', 'BLUE': '#0000FF', 'GREEN': '#00FF00', 'GOLD': '#FFD700' };
          return `    self.set_led_async("${colorMap[dropdown_color]}")\n`;
        };

        // 4. Inject the clean Workspace layout canvas
        const workspace = Blockly.inject('blocklyDiv', {
          toolbox: document.getElementById('toolbox'),
          grid: {spacing: 20, length: 3, colour: '#444', snap: true},
          trashcan: true,
          media: 'https://cloudflare.com'
        });

        // 5. Update the live preview panel automatically
        workspace.addChangeListener(() => {
          try {
            const pythonCode = PythonGenerator.workspaceToCode(workspace);
            const outputWindow = document.getElementById('outputCode');
            outputWindow.value = pythonCode.trim() === "" 
              ? "# Drag and drop blocks here to see Python compilation..." 
              : pythonCode;
          } catch (error) {
            console.error("Compilation error:", error);
          }
        });

        // 6. Build the network trigger out to the local Pi Server
        document.getElementById('runBtn').addEventListener('click', () => {
          const PI_IP_ADDRESS = "192.168.1.100"; // Replace with your Pi's IP address
          const generatedCode = PythonGenerator.workspaceToCode(workspace);
          
          if (!generatedCode) {
            alert("Drag some blocks onto the canvas first!");
            return;
          }

          fetch(`http://${PI_IP_ADDRESS}:5000/run-code`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ code: generatedCode })
          })
          .then(res => res.json())
          .then(data => {
            if(data.status === "success") {
              alert("✨ Magic compiled! Click your wand button to run.");
            } else {
              alert("❌ Error: " + data.message);
            }
          })
          .catch(err => {
            alert("Could not talk to the Pi! Make sure server.py is running on the Pi.");
            console.error(err);
          });
        });

      }, 500);
    });
  </script>
</body>
</html>
